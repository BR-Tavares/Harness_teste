name: Invoke Replicable Harness v6

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      feature_id:
        description: "ID da Feature (ex: F01)"
        required: true
        default: "F01"
      version:
        description: "Versao de maturidade (ex: v0, v1)"
        required: true
        default: "v0"
      engine:
        description: "Opcao de modelo: 'haiku' (Claude 3.5 Haiku), 'gemini-pro' (Gemini 3.1 Pro), ou 'auto'"
        required: true
        default: "haiku"
        type: choice
        options:
          - haiku
          - gemini-pro
          - auto

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run-spec-and-plan:
    name: Call Central Harness Spec Engine
    uses: BR-Tavares/Replicable_Harness_spec_gh-aw/.github/workflows/reusable-harness.yml@main
    with:
      feature_id: ${{ inputs.feature_id || 'F01' }}
      version: ${{ inputs.version || 'v0' }}
      engine: ${{ inputs.engine || 'auto' }}
    secrets: inherit
